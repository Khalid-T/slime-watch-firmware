; The slime watch: Waveshare ESP32-S3-Touch-LCD-1.28 (ESP32-S3R2: 16 MB
; flash, 2 MB QSPI PSRAM). Build with the PlatformIO in
; ~/.local/share/pio-venv (python 3.11: platformio refuses 3.14):
;   PATH=~/.local/share/pio-venv/bin:$PATH pio run
;   pio run -t upload   (the board on /dev/ttyACM0)
;   pio device monitor
[env:watch]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; THE WRIST WARDROBE (2026-09-17): partitions.csv -- two 3 MB app slots, the
; 2 MB `art` partition at 0x610000 (wardrobe.bin, its own flash step), the
; day log's LittleFS at 0x810000 (README "THE WARDROBE"; was default_16MB.csv)
board_build.partitions = partitions.csv
; the S3R2's PSRAM is quad SPI (an R8 would be opi_opi)
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DLGFX_USE_V1
    ; BLUETOOTH (2026-09-10 21:50, ruling 58: "do BLE only when WiFi is
    ; down"): NimBLE in the default build, trimmed to what ANCS needs --
    ; one link, no scanning (the observer role out), the host's pools in
    ; the 2 MB PSRAM (the controller's own ~35 KB stays internal: it must).
    ; The stack is up only while the WiFi radio is down (src/ble.cpp), so
    ; its heap and WiFi + TLS's are never added: README "BLUETOOTH".
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    ; TWO LINKS (2026-10-06): the phone (ANCS) and the desk (THE AIR DOOR, bleuart.cpp) at once
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
build_src_filter = +<*> -<../tools/>
; THE BUILD ID: tools/build_id.py writes src/build_id.h (the git hash, gitignored) before every build; `doctor` prints it
extra_scripts = pre:tools/build_id.py
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    ; the BLE stack (BLUETOOTH above); h2zero's, on the core's own controller -- not the core's Bluedroid (~100 KB heavier)
    h2zero/NimBLE-Arduino@^2.5.1
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
upload_speed = 921600

; Over the air, once the watch is on WiFi (ArduinoOTA on slime-watch.local;
; the password is the link key's first 8 characters, or `ota <pw>`):
;   WATCH_OTA_PW=xxxxxxxx pio run -e ota -t upload
;   pio run -e ota -t upload --upload-port <ip>   (an IP when mDNS is not on your LAN)
[env:ota]
extends = env:watch
upload_protocol = espota
upload_port = slime-watch.local
upload_flags =
    --auth=${sysenv.WATCH_OTA_PW}
    --timeout=30

; The `watch-ancs` env is GONE (2026-09-10 21:50): BLE and the iPhone's
; ANCS client are in the default build above, gated by ruling 58. Two
; envs, one build: `watch` on the cable, `ota` over the air.
